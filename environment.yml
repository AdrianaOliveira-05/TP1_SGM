name: TP1_AO_GC
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # Base
  - python=3.10
  - pip
  - make
  - wget
  - unzip

  # Qualidade dos dados (QC)
  - fastqc
  - multiqc
  - ea-utils
  - fastp
  - cutadapt
  - seqtk=1.4
  - nanofilt=2.8
  - falco=1.2.1

  # Montagem
  - spades
  - flye
  - unicycler

  # Avaliação da montagem
  - quast

  # Anotação
  - prokka

  # Outros utilitários
  - tree
